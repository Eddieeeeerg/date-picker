<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ellie & Eddie’s Dinner Dates 💖</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Ellie & Eddie’s Dinner Dates 💖</h1>
  </header>

  <main>
    <!-- Phase 1: area selection -->
    <section id="area-section">
      <h2>Where do you want to eat?</h2>
      <div id="areas"></div>
    </section>
  <!-- PHASE 2: Health-level selection -->
  <section id="category-section" hidden>
    <h2>Healthy or Less Healthy?</h2>
    <div id="health-options"></div>
  </section>

  <!-- PHASE 2: Sub-category selection -->
  <section id="subcategory-section" hidden>
    <h2>Choose a Food Type</h2>
    <div id="subcategories"></div>
  </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/winwheel@2.7.0/Winwheel.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
